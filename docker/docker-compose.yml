version: '3.8'

services:
  # PostgreSQL database for production deployments
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: sim2l
      POSTGRES_PASSWORD: sim2l_password
      POSTGRES_DB: sim2l
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim2l"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache service (SQLite mode - for development)
  cache-sqlite:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cache
    environment:
      BACKEND: sqlite
      DB_PATH: /data/cache.db
      HOST: 0.0.0.0
      PORT: 8001
    volumes:
      - cache_data:/data
    ports:
      - "8001:8001"
    profiles:
      - sqlite
      - dev
    networks:
      default:
        aliases:
          - cache

  # Cache service (PostgreSQL mode - for production)
  cache-postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cache
    environment:
      BACKEND: postgresql
      DB_URL: postgresql://sim2l:sim2l_password@postgres:5432/sim2l_cache
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - postgresql
      - prod
    networks:
      default:
        aliases:
          - cache

  # Catalog service (SQLite mode - for development)
  catalog-sqlite:
    build:
      context: ..
      dockerfile: docker/Dockerfile.catalog
    environment:
      BACKEND: sqlite
      DB_PATH: /data/catalog.db
      HOST: 0.0.0.0
      PORT: 8002
    volumes:
      - catalog_data:/data
    ports:
      - "8002:8002"
    profiles:
      - sqlite
      - dev
    networks:
      default:
        aliases:
          - catalog

  # Catalog service (PostgreSQL mode - for production)
  catalog-postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.catalog
    environment:
      BACKEND: postgresql
      DB_URL: postgresql://sim2l:sim2l_password@postgres:5432/sim2l_catalog
      HOST: 0.0.0.0
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - postgresql
      - prod
    networks:
      default:
        aliases:
          - catalog

  # Results service (SQLite mode - for development)
  results-sqlite:
    build:
      context: ..
      dockerfile: docker/Dockerfile.results
    environment:
      BACKEND: sqlite
      DB_PATH: /data/results.db
      HOST: 0.0.0.0
      PORT: 8003
    volumes:
      - results_data:/data
    ports:
      - "8003:8003"
    profiles:
      - sqlite
      - dev
    networks:
      default:
        aliases:
          - results

  # Results service (PostgreSQL mode - for production)
  results-postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.results
    environment:
      BACKEND: postgresql
      DB_URL: postgresql://sim2l:sim2l_password@postgres:5432/sim2l_results
      HOST: 0.0.0.0
      PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - postgresql
      - prod
    networks:
      default:
        aliases:
          - results

  # Web UI
  web-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-ui
    ports:
      - "3000:3000"
    depends_on:
      - cache-sqlite
      - catalog-sqlite
      - results-sqlite
    profiles:
      - dev
    networks:
      default:
        aliases:
          - web-ui

  # Web UI (Production mode)
  web-ui-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-ui
    ports:
      - "3000:3000"
    depends_on:
      - cache-postgres
      - catalog-postgres
      - results-postgres
    profiles:
      - prod
    networks:
      default:
        aliases:
          - web-ui

volumes:
  postgres_data:
  cache_data:
  catalog_data:
  results_data:
