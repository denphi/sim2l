[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2l"
dynamic = ["version"]
description = "Simulation framework with database-backed persistence"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Daniel Mejia", email = "denphi@denphi.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
keywords = ["simulation", "jupyter", "notebook", "database", "scientific-computing", "workflow"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pint>=0.20",
    "pyyaml>=5.4",
    "papermill>=2.3",
    "jsonpickle>=2.0",
    "pillow>=8.0",
    "mendeleev>=0.9",
    "ipython>=7.0",
    "click>=8.0",
    "tabulate>=0.8",
    "flask>=2.0",
    "requests>=2.25",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8",
]
notebooks = [
    "scrapbook>=0.5",
]

[project.urls]
Homepage = "https://github.com/denphi/sim2l"
Documentation = "https://sim2l.readthedocs.io"
Repository = "https://github.com/denphi/sim2l"
"Bug Reports" = "https://github.com/denphi/sim2l/issues"

[project.scripts]
sim2l = "sim2l.cli.main:cli"
sim2l-services = "sim2l.cli.services:services"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["sim2l*"]

[tool.setuptools.dynamic]
version = {attr = "sim2l.version.__version__"}

[tool.setuptools.package-data]
sim2l = ["repository/*.sql", "database/*.sql"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sim2l --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
